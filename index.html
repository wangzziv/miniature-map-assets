<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>建築微縮模型互動地圖</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        #map { width: 100%; height: 100vh; z-index: 1; }
        
        #sidebar {
            position: absolute; top: 20px; right: 20px; z-index: 2000;
            width: 380px; max-height: calc(100vh - 40px);
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            padding: 20px; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            display: none; overflow-y: auto;
        }
        #sidebar img { width: 100%; height: auto; max-height: 280px; border-radius: 8px; margin: 12px 0; object-fit: cover; }
        .close-btn { float: right; cursor: pointer; font-size: 22px; font-weight: bold; color: #888; }
        .region-tag { display: inline-block; background: #e3f2fd; color: #1565c0; padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: 600; }
        .coords-tag { font-size: 12px; color: #777; margin-top: 4px; }
        
        .custom-red-dot {
            background-color: #e53935;
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

<div id="sidebar">
    <span class="close-btn" onclick="closeSidebar()">✕</span>
    <span id="info-region" class="region-tag">分類</span>
    <h2 id="info-title" style="margin: 10px 0 5px 0; font-size: 18px; color: #222;">模型名稱</h2>
    <div id="info-coords" class="coords-tag">經緯度</div>
    <img id="info-img" src="" alt="微縮模型展示圖">
    <p id="info-desc" style="color: #444; line-height: 1.6; font-size: 14px; margin-top: 10px;">模型詳細說明...</p>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

<script>
    const map = L.map('map').setView([28.0000, 129.0000], 6);

    const digitalLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' });
    const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18, attribution: 'Tiles © Esri' });

    digitalLayer.addTo(map);
    L.control.layers({ "🗺️ 數位向量圖": digitalLayer, "🛰️ 衛星空拍圖": satelliteLayer }).addTo(map);

    const redDotIcon = L.divIcon({
        className: 'custom-red-dot',
        iconSize: [16, 16],
        iconAnchor: [8, 8]
    });

    function cleanUrl(urlStr) {
        if (!urlStr) return '';
        let url = urlStr.trim();
        const match = url.match(/(https?:\/\/[^\s\)\],]+)/);
        if (match) url = match[1];
        try {
            return decodeURIComponent(url);
        } catch(e) {
            return url;
        }
    }

    // 直接指定 CSV 檔名（因為 index.html 與 CSV 在同一個資料夾，直接讀取同目錄檔案能 100% 避開網路跨域阻擋）
    Papa.parse('Felt_Map_Template.csv', {
        download: true,
        skipEmptyLines: true,
        complete: function(results) {
            const rows = results.data;
            const validBounds = [];

            if (!rows || rows.length <= 1) {
                alert('未找到 CSV 資料列');
                return;
            }

            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                if (!row || row.length < 3) continue;

                const name = row[0] ? row[0].trim() : '未命名模型';
                const lat = parseFloat(row[1]);
                const lng = parseFloat(row[2]);
                const region = row[3] ? row[3].trim() : (row[4] ? row[4].trim() : '微縮模型');
                const rawImg = row[5] ? row[5].trim() : '';
                const desc = row[6] ? row[6].trim() : '尚無詳細說明。';

                if (!isNaN(lat) && !isNaN(lng)) {
                    validBounds.push([lat, lng]);

                    const imgUrl = cleanUrl(rawImg);

                    const marker = L.marker([lat, lng], { icon: redDotIcon, zIndexOffset: 1000 }).addTo(map);

                    marker.bindTooltip(name, { direction: 'top', offset: [0, -8] });

                    marker.on('click', () => {
                        document.getElementById('info-title').innerText = name;
                        document.getElementById('info-region').innerText = region;
                        document.getElementById('info-coords').innerText = `📍 經緯度：${lat.toFixed(6)}, ${lng.toFixed(6)}`;
                        
                        const imgElem = document.getElementById('info-img');
                        if (imgUrl) {
                            imgElem.src = imgUrl;
                            imgElem.style.display = 'block';
                        } else {
                            imgElem.style.display = 'none';
                        }

                        document.getElementById('info-desc').innerText = desc;
                        document.getElementById('sidebar').style.display = 'block';
                        map.panTo([lat, lng]);
                    });
                }
            }

            // 成功解析後，將視角精準對齊標點範圍
            if (validBounds.length > 0) {
                map.fitBounds(validBounds, { padding: [80, 80] });
            }
        },
        error: function(err) {
            alert('讀取 CSV 失敗：' + JSON.stringify(err));
        }
    });

    function closeSidebar() {
        document.getElementById('sidebar').style.display = 'none';
    }
</script>
</body>
</html>

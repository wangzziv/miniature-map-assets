<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>建築微縮模型互動地圖</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        #map { width: 100%; height: 100vh; z-index: 1; }
        
        #sidebar {
            position: absolute; top: 20px; right: 20px; z-index: 1000;
            width: 380px; max-height: calc(100vh - 40px);
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            padding: 20px; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            display: none; overflow-y: auto; transition: all 0.3s ease;
        }
        
        /* 圖片容器與載入動畫 */
        .img-container {
            width: 100%; height: 220px; background: #f0f0f0;
            border-radius: 8px; margin: 12px 0; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        #sidebar img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .spinner {
            width: 30px; height: 30px; border: 3px solid #ccc;
            border-top-color: #1565c0; border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .close-btn { float: right; cursor: pointer; font-size: 22px; font-weight: bold; color: #888; }
        .close-btn:hover { color: #000; }
        .region-tag { display: inline-block; background: #e3f2fd; color: #1565c0; padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: 600; }
        .coords-tag { font-size: 12px; color: #777; margin-top: 4px; }
    </style>
</head>
<body>

<div id="sidebar">
    <span class="close-btn" onclick="closeSidebar()">✕</span>
    <span id="info-region" class="region-tag">分類</span>
    <h2 id="info-title" style="margin: 10px 0 5px 0; font-size: 18px; color: #222;">模型名稱</h2>
    <div id="info-coords" class="coords-tag">經緯度</div>
    
    <div class="img-container">
        <div id="img-loader" class="spinner"></div>
        <img id="info-img" src="" alt="微縮模型展示圖">
    </div>
    
    <p id="info-desc" style="color: #444; line-height: 1.6; font-size: 14px; margin-top: 10px;">模型詳細說明...</p>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

<script>
    const map = L.map('map').setView([26.5000, 127.8000], 7);

    const digitalLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '© OpenStreetMap'
    });

    const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 18, attribution: 'Tiles © Esri'
    });

    digitalLayer.addTo(map);

    const baseMaps = {
        "🗺️ 數位向量圖": digitalLayer,
        "🛰️ 衛星空拍圖": satelliteLayer
    };
    L.control.layers(baseMaps).addTo(map);

    const markersCluster = L.markerClusterGroup();
    map.addLayer(markersCluster);

    // 清洗與轉換圖片 CDN 網址 (提升圖片載入速度)
    function cleanAndOptimizeUrl(rawText) {
        if (!rawText) return '';
        let url = rawText.trim();
        const match = url.match(/\((https?:\/\/[^\)]+)\)/);
        if (match) url = match[1];
        const bracketMatch = url.match(/\[(https?:\/\/[^\]]+)\]/);
        if (bracketMatch) url = bracketMatch[1];
        
        // 將 raw.githubusercontent.com 轉為 jsDelivr CDN 全球加速連結
        if (url.includes('raw.githubusercontent.com')) {
            url = url.replace('raw.githubusercontent.com/wangzziv/miniature-map-assets/main/', 'cdn.jsdelivr.net/gh/wangzziv/miniature-map-assets@main/');
        }
        return url;
    }

    const csvUrl = 'https://raw.githubusercontent.com/wangzziv/miniature-map-assets/main/Felt_Map_Template.csv';

    // 以 Blob arrayBuffer + TextDecoder 處理 UTF-8 解碼，徹底解決中文與日文亂碼問題
    fetch(csvUrl)
        .then(response => response.arrayBuffer())
        .then(buffer => {
            const decoder = new TextDecoder('utf-8');
            let csvText = decoder.decode(buffer);
            
            // 防呆：如果檢測到特殊開頭再用 Big5 備用解碼
            if (csvText.includes('')) {
                const big5Decoder = new TextDecoder('big5');
                csvText = big5Decoder.decode(buffer);
            }

            Papa.parse(csvText, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    const data = results.data;
                    const validBounds = [];

                    data.forEach(item => {
                        let latVal = null, lngVal = null, rawImg = '', name = '', region = '', desc = '';

                        Object.keys(item).forEach(key => {
                            const k = key.trim().toLowerCase();
                            if (k === 'latitude' || k === 'lat' || k === '緯度' || k === 'y') latVal = item[key];
                            if (k === 'longitude' || k === 'lng' || k === 'long' || k === '經度' || k === 'x') lngVal = item[key];
                            if (k.includes('image') || k.includes('url') || k.includes('photo') || k.includes('picture') || k === '圖片') rawImg = item[key];
                            if (k === 'name' || k === 'title' || k === '名稱' || k === '標題') name = item[key];
                            if (k === 'region' || k === 'city' || k === 'state' || k === '區域' || k === '縣市') region = item[key];
                            if (k === 'description' || k === 'desc' || k === '說明' || k === '備註') desc = item[key];
                        });

                        if (latVal && lngVal) {
                            const lat = parseFloat(latVal);
                            const lng = parseFloat(lngVal);

                            if (!isNaN(lat) && !isNaN(lng)) {
                                validBounds.push([lat, lng]);

                                const imgUrl = cleanAndOptimizeUrl(rawImg);
                                const displayName = name || '未命名模型';
                                const displayRegion = region || '微縮模型點位';
                                const displayDesc = desc || '尚無詳細說明。';

                                const marker = L.circleMarker([lat, lng], {
                                    color: '#b71c1c',
                                    fillColor: '#e53935',
                                    fillOpacity: 0.9,
                                    radius: 9
                                });

                                marker.bindTooltip(displayName, { direction: 'top', offset: [0, -6] });

                                marker.on('click', () => {
                                    document.getElementById('info-title').innerText = displayName;
                                    document.getElementById('info-region').innerText = displayRegion;
                                    document.getElementById('info-coords').innerText = `📍 經緯度：${lat.toFixed(6)}, ${lng.toFixed(6)}`;
                                    
                                    const imgElem = document.getElementById('info-img');
                                    const loader = document.getElementById('img-loader');
                                    
                                    if (imgUrl) {
                                        loader.style.display = 'block';
                                        imgElem.style.display = 'none';
                                        imgElem.src = imgUrl;

                                        imgElem.onload = () => {
                                            loader.style.display = 'none';
                                            imgElem.style.display = 'block';
                                        };
                                        imgElem.onerror = () => {
                                            loader.style.display = 'none';
                                            imgElem.style.display = 'none';
                                        };
                                    } else {
                                        loader.style.display = 'none';
                                        imgElem.style.display = 'none';
                                    }

                                    document.getElementById('info-desc').innerText = displayDesc;
                                    document.getElementById('sidebar').style.display = 'block';
                                    map.panTo([lat, lng]);
                                });

                                markersCluster.addLayer(marker);
                            }
                        }
                    });

                    if (validBounds.length > 0) {
                        map.fitBounds(validBounds, { padding: [50, 50] });
                    }
                }
            });
        });

    function closeSidebar() {
        document.getElementById('sidebar').style.display = 'none';
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>建築微縮模型互動地圖</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        #map { width: 100%; height: 100vh; z-index: 1; }
        
        #sidebar {
            position: absolute; top: 20px; right: 20px; z-index: 1000;
            width: 380px; max-height: calc(100vh - 40px);
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            padding: 20px; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            display: none; overflow-y: auto;
        }
        #sidebar img { width: 100%; height: auto; max-height: 280px; border-radius: 8px; margin: 12px 0; object-fit: cover; }
        .close-btn { float: right; cursor: pointer; font-size: 22px; font-weight: bold; color: #888; }
        .region-tag { display: inline-block; background: #e3f2fd; color: #1565c0; padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: 600; }
        .coords-tag { font-size: 12px; color: #777; margin-top: 4px; }
    </style>
</head>
<body>

<div id="sidebar">
    <span class="close-btn" onclick="closeSidebar()">✕</span>
    <span id="info-region" class="region-tag">分類</span>
    <h2 id="info-title" style="margin: 10px 0 5px 0; font-size: 18px; color: #222;">模型名稱</h2>
    <div id="info-coords" class="coords-tag">經緯度</div>
    <img id="info-img" src="" alt="微縮模型展示圖">
    <p id="info-desc" style="color: #444; line-height: 1.6; font-size: 14px; margin-top: 10px;">模型詳細說明...</p>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

<script>
    const map = L.map('map').setView([26.5000, 127.8000], 7);

    const digitalLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' });
    const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18, attribution: 'Tiles © Esri' });

    digitalLayer.addTo(map);
    L.control.layers({ "🗺️ 數位向量圖": digitalLayer, "🛰️ 衛星空拍圖": satelliteLayer }).addTo(map);

    const markersCluster = L.markerClusterGroup();
    map.addLayer(markersCluster);

    // 深度網址清洗：專治雙重網址、[網址](網址)、結尾逗號等雜質
    function cleanAndOptimizeUrl(rawText) {
        if (!rawText) return '';
        let url = rawText.trim();
        
        // 抓取第一個合法的 http(s) 連結
        const match = url.match(/(https?:\/\/[^\s\)\],]+)/);
        if (match) {
            url = match[1];
        }

        // 自動轉為 CDN 加速圖片載入速度
        if (url.includes('raw.githubusercontent.com')) {
            url = url.replace('raw.githubusercontent.com/wangzziv/miniature-map-assets/refs/heads/main/', 'cdn.jsdelivr.net/gh/wangzziv/miniature-map-assets@main/')
                     .replace('raw.githubusercontent.com/wangzziv/miniature-map-assets/main/', 'cdn.jsdelivr.net/gh/wangzziv/miniature-map-assets@main/');
        }
        return url;
    }

    const csvUrl = 'https://raw.githubusercontent.com/wangzziv/miniature-map-assets/main/Felt_Map_Template.csv?t=' + new Date().getTime();

    fetch(csvUrl)
        .then(response => response.text())
        .then(rawCsv => {
            // 清理隱形 BOM
            const cleanCsv = rawCsv.replace(/^\uFEFF/, '');

            Papa.parse(cleanCsv, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    const validBounds = [];

                    results.data.forEach(item => {
                        let latVal = null, lngVal = null, rawImg = '', name = '', region = '', desc = '';

                        Object.keys(item).forEach(key => {
                            const cleanKey = key.replace(/[^\x00-\x7F]/g, "").trim().toLowerCase();
                            const rawKey = key.trim().toLowerCase();

                            if (cleanKey === 'latitude' || cleanKey === 'lat' || rawKey.includes('緯度')) latVal = item[key];
                            if (cleanKey === 'longitude' || cleanKey === 'lng' || rawKey.includes('經度')) lngVal = item[key];
                            if (cleanKey.includes('image') || cleanKey.includes('url') || rawKey.includes('圖片')) rawImg = item[key];
                            if (cleanKey === 'name' || cleanKey === 'title' || rawKey.includes('名稱')) name = item[key];
                            if (cleanKey === 'region' || cleanKey === 'city' || rawKey.includes('區域') || rawKey.includes('縣市')) region = item[key];
                            if (cleanKey === 'description' || cleanKey === 'desc' || rawKey.includes('說明')) desc = item[key];
                        });

                        if (latVal && lngVal) {
                            const lat = parseFloat(latVal);
                            const lng = parseFloat(lngVal);

                            if (!isNaN(lat) && !isNaN(lng)) {
                                validBounds.push([lat, lng]);

                                const imgUrl = cleanAndOptimizeUrl(rawImg);
                                const displayName = name || '未命名模型';

                                const marker = L.circleMarker([lat, lng], {
                                    color: '#b71c1c',
                                    fillColor: '#e53935',
                                    fillOpacity: 0.9,
                                    radius: 9
                                });

                                marker.bindTooltip(displayName, { direction: 'top', offset: [0, -6] });

                                marker.on('click', () => {
                                    document.getElementById('info-title').innerText = displayName;
                                    document.getElementById('info-region').innerText = region || '微縮模型點位';
                                    document.getElementById('info-coords').innerText = `📍 經緯度：${lat.toFixed(6)}, ${lng.toFixed(6)}`;
                                    
                                    const imgElem = document.getElementById('info-img');
                                    if (imgUrl) {
                                        imgElem.src = imgUrl;
                                        imgElem.style.display = 'block';
                                    } else {
                                        imgElem.style.display = 'none';
                                    }

                                    document.getElementById('info-desc').innerText = desc || '尚無詳細說明。';
                                    document.getElementById('sidebar').style.display = 'block';
                                    map.panTo([lat, lng]);
                                });

                                markersCluster.addLayer(marker);
                            }
                        }
                    });

                    if (validBounds.length > 0) {
                        map.fitBounds(validBounds, { padding: [50, 50] });
                    }
                }
            });
        });

    function closeSidebar() {
        document.getElementById('sidebar').style.display = 'none';
    }
</script>
</body>
</html>
